name: fetch-to-hyperdrop
# Thin wrapper: all logic lives in scripts/run.sh so it can be updated without touching this file.
on:
  push:
    paths: ["jobs/*.json"]
  workflow_dispatch:
    inputs:
      url:  { description: "Video / page URL for yt-dlp", required: true }
      name: { description: "Optional output file name (without extension)", required: false }
permissions:
  contents: write
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_NAME: ${{ github.event.inputs.name }}
          BEFORE_SHA: ${{ github.event.before }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: bash scripts/run.sh
